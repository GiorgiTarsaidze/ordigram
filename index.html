<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ordigram playground</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <header class="bar">
      <strong class="brand">ordigram</strong>
      <nav class="crumbs" id="crumbs" aria-label="Where you are"></nav>
      <label class="pick">Diagram <select id="example"></select></label>
      <button id="tidy" type="button" title="Put every box on this level back in its automatic place">Tidy</button>
      <button id="reset" type="button">Reset</button>
    </header>
    <main class="split">
      <section class="code">
        <div class="editor">
          <div class="gutter" id="gutter" aria-hidden="true"></div>
          <div class="area">
            <div class="mark" id="mark" aria-hidden="true"></div>
            <pre class="paint" id="paint" aria-hidden="true"></pre>
            <textarea id="src" spellcheck="false" wrap="off" autocapitalize="off" autocomplete="off" aria-label="Diagram text"></textarea>
          </div>
        </div>
        <ul class="problems" id="problems"></ul>
      </section>
      <section class="view">
        <svg id="canvas" role="img" aria-label="Diagram" tabindex="0"></svg>
        <p class="hint">Drag on empty space to select · Shift-click adds · Drag a dot to connect · Hold Shift while moving to straighten · Double-click to open, rename or add · Delete removes · Esc goes back</p>
      </section>
    </main>
    <footer class="status" id="status"></footer>
    <script type="module" src="/playground/main.ts"></script>
  </body>
</html>
